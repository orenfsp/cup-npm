[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "otklik-api"
version = "0.1.0"
description = "Production foundation for the Otklik API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.2",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "pillow==12.3.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pwdlib==0.3.1",
  "PyJWT==2.13.0",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "SQLAlchemy[asyncio]==2.0.52",
  "uvicorn==0.52.4",
]


[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "psycopg[binary]==3.3.5",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]
